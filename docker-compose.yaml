# 主程式（整包 src/）的映像檔：discord-bot 與 search-mcp 共用（各層共用、不多佔硬碟）；兩個爬蟲各有自己的映像檔。
# 跑整包 src/ 的服務都引用這一份：改 Dockerfile 路徑時不會只改到一邊，讓套件版本悄悄分岔
x-main-build: &main-build
  context: .
  dockerfile: docker/discord_bot/dockerfile

services:
  discord-bot:
    build: *main-build
    container_name: discord-bot
    restart: always
    # 啟動前自動探索並跑 src/test/ 下所有 hermetic 單元測試（test_*.py）；測試紅就 exit 1，
    # compose 會無限重啟 → log 立刻可見。`exec` 讓 python 取代 bash 當 PID 1，停止訊號才會送到 bot 而不是 bash。
    # 加新測試＝建 test_<feature>.py 即可，無須改此行（不再手動維護列表、不會漏測）。
    # 需 live 服務的整合測試放 test/integration/（it_*.py），不符 test_*.py → 自動排除出 gate。
    command: >
      bash -c "
      echo '--- running startup tests (auto-discover) ---' &&
      APP_STARTUP_GATE=1 python -m unittest discover -s test -t . -p 'test_*.py' &&
      echo '--- tests OK, starting bot ---' &&
      exec python discord_bot.py
      "
    # 停止時送 SIGINT（同 Ctrl+C）而不是預設的 SIGTERM：容器的 PID 1 只收得到自己有接的訊號，
    # python 預設只接 SIGINT；送 SIGTERM 會被丟掉、等 10 秒後被強制砍掉，bot.close() 沒機會跑。
    # 啟動測試還在跑時 PID 1 是 bash，停止一樣要等 10 秒被強制結束。
    stop_signal: SIGINT
    expose:
      - "5000"  # notify server，供 scraper 內網通知用
    volumes:
      - type: bind
        source: ./src
        target: /app
      - type: bind
        source: ./logs
        target: /logs
      # GPU 鎖檔和 search-mcp 共用：兩個容器的 /tmp 是分開的，鎖檔放各自的 /tmp 就各排各的隊
      - type: bind
        source: ./gpu_lock
        target: /gpu_lock
    env_file:
      - .env
    environment:
      # LlamaIndex 將在此服務中以 Python 套件方式執行（非獨立容器）
      - TZ=Asia/Taipei
      - LEMONADE_GPU_LOCK_PATH=/gpu_lock/lemonade_gpu.lock
    networks:
      - discord-net
    depends_on:
      pgvector:
        condition: service_healthy

  # 情報搜尋的 MCP server（常駐）：給這台的 Claude Code 連（.mcp.json → http://127.0.0.1:8765/mcp），
  # 背景每 50 秒同步搜尋索引、每天 03:00 補算新文章的向量（llm/mcp_server.py、services/search/background.py）。
  # 沿用 bot 的映像與程式碼，但只帶用得到的環境變數：不帶 Discord token、Telegram 憑證
  search-mcp:
    build: *main-build
    container_name: search-mcp
    restart: always
    command: ["python", "-m", "llm.mcp_server", "--http"]
    expose:
      - "8765"  # 同一個 docker 網路的服務用 http://search-mcp:8765/mcp
    ports:
      - "127.0.0.1:8765:8765"  # 只綁本機：主機上的服務連得到，別台連不到
    volumes:
      - type: bind
        source: ./src
        target: /app
      - type: bind
        source: ./logs
        target: /logs
      # 搜尋索引（從 articles.db 建出來的衍生資料，刪掉會自動重建）
      - type: bind
        source: ./search_data
        target: /search_data
      - type: bind
        source: ./gpu_lock
        target: /gpu_lock
    environment:
      - TZ=Asia/Taipei
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LEMONADE_GPU_LOCK_PATH=/gpu_lock/lemonade_gpu.lock
      - LLM_BASE_URL=${LLM_BASE_URL:?LLM_BASE_URL_required}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - PGVECTOR_DB=${PGVECTOR_DB:-discord_data}
      - PGVECTOR_USER=${PGVECTOR_USER:?PGVECTOR_USER_required}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD_required}
    networks:
      - discord-net
    depends_on:
      pgvector:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: docker/scraper/dockerfile
    container_name: scraper
    restart: always
    # FB 爬蟲每小時開關一次 Firefox（fb_scraper_service.py），Firefox 結束後它的子程序會改掛到容器的 PID 1。
    # 沒有 init 時 PID 1 是 python main.py，它不會清掉這些已結束的程序，會一直累積成殭屍（ps 裡的 <defunct>）。
    # init: true 讓 Docker 用一個小 init 程式當 PID 1，由它負責清掉。
    init: true
    expose:
      - "8000"  # 只在內網暴露 API 端口
    volumes:
      - type: bind
        source: ./src/scraper
        target: /app
      - type: bind
        source: ./logs
        target: /logs
    environment:
      - TZ=Asia/Taipei
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./articles.db}
      # 打 bot 通知伺服器時帶的共用密鑰，和 bot 同一個值（bot 從 env_file 拿）；沒設兩邊都不驗
      - NOTIFY_SHARED_SECRET=${NOTIFY_SHARED_SECRET:-}
    networks:
      - discord-net

  telegram-scraper:
    build:
      context: .
      dockerfile: docker/telegram_scraper/dockerfile
    container_name: telegram-scraper
    restart: always
    volumes:
      - type: bind
        source: ./src/telegram_scraper
        target: /app
      # 和 bot 共用的定義（頻道正規化、補圖時限）；只掛這一小包，不讓爬蟲看到 bot 其他程式
      - type: bind
        source: ./src/shared
        target: /opt/pylib/shared
        read_only: true
      - type: bind
        source: ./logs
        target: /logs
    environment:
      - TZ=Asia/Taipei
      - PYTHONPATH=/opt/pylib
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:?TELEGRAM_API_ID_required}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:?TELEGRAM_API_HASH_required}
      - TELEGRAM_PG_NOTIFY_CHANNEL=${TELEGRAM_PG_NOTIFY_CHANNEL:-telegram_new_message}
      - TELEGRAM_PGVECTOR_DB=${TELEGRAM_PGVECTOR_DB:-telegram_data}
      - PGVECTOR_DB=${PGVECTOR_DB:-discord_data}
      - PGVECTOR_USER=${PGVECTOR_USER:?PGVECTOR_USER_required}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD_required}
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - discord-net

  pgvector:
    image: pgvector/pgvector:pg18-trixie
    container_name: pgvector
    restart: always
    expose:
      - "5432"
    volumes:
      - vector_data:/var/lib/postgresql
    environment:
      - TZ=Asia/Taipei
      - POSTGRES_DB=${PGVECTOR_DB:-discord_data}
      - POSTGRES_USER=${PGVECTOR_USER:?PGVECTOR_USER_required}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD_required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:?PGVECTOR_USER_required} -d ${PGVECTOR_DB:-discord_data}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - discord-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    expose:
      - "8080"  # 內網給 discord-bot 呼叫
    ports:
      - "127.0.0.1:8888:8080"  # 僅本機 browser 測試用，不對外
    volumes:
      - type: bind
        source: ./searxng
        target: /etc/searxng
    environment:
      - TZ=Asia/Taipei
      # 官方 entrypoint 預設會 `chown -R searxng:searxng /etc/searxng`，把 bind mount 出來的
      # ./searxng 搶成 uid 977 → 主機端要 sudo 才改得動設定。關掉它，設定檔就能用一般身分編輯。
      # 安全：SearXNG 只「讀」settings.yml（entrypoint 的 setup() 只在檔案不存在時才從樣板產生），
      # 而且主程序是以 root 跑，讀 644 的檔案沒有問題。關掉只會在啟動 log 印一行 warning。
      # 注意：改這行要 `docker compose up -d searxng` 重建容器，`docker restart` 不會套用新 env。
      - FORCE_OWNERSHIP=false
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change_me_please_use_long_random_string}
      - UWSGI_WORKERS=${SEARXNG_WORKERS:-2}
      - UWSGI_THREADS=${SEARXNG_THREADS:-2}
    networks:
      - discord-net

networks:
  discord-net:
    driver: bridge

volumes:
  vector_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/vector_data
