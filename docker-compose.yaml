# 主程式（整包 src/）的映像檔：discord-bot 與 search-mcp 共用（各層共用、不多佔硬碟）；兩個爬蟲各有自己的映像檔。
# 跑整包 src/ 的服務都引用這一份：改 Dockerfile 路徑時不會只改到一邊，讓套件版本悄悄分岔
x-main-build: &main-build
  context: .
  dockerfile: docker/discord_bot/dockerfile

services:
  discord-bot:
    build: *main-build
    container_name: discord-bot
    restart: always
    # 啟動前只跑守衛（分層、共用元件、錯誤邊界）、import 解析與設定載入（src/test/gate.py，約 20 秒）；紅就 exit 1，
    # compose 會無限重啟 → log 立刻可見。完整測試（一千五百多項、約兩分鐘）改由收工前的 `make test` 與 CI 跑。
    # `exec` 讓 python 取代 bash 當 PID 1，停止訊號才會送到 bot 而不是 bash。
    command: >
      bash -c "
      echo '--- running startup gate ---' &&
      APP_STARTUP_GATE=1 python -m test.gate &&
      echo '--- gate OK, starting bot ---' &&
      exec python discord_bot.py
      "
    # 停止時送 SIGINT（同 Ctrl+C）而不是預設的 SIGTERM：容器的 PID 1 只收得到自己有接的訊號，
    # python 預設只接 SIGINT；送 SIGTERM 會被丟掉、等 10 秒後被強制砍掉，bot.close() 沒機會跑。
    # 啟動測試還在跑時 PID 1 是 bash，停止一樣要等 10 秒被強制結束。
    stop_signal: SIGINT
    expose:
      # notify server，兩組端點各自驗證、憑證互不通用：
      #   /notify/*：scraper 的通知，驗證 X-Notify-Secret
      #   /v1/*：hermes 的 OpenAI 相容模型端點，驗證 Bearer HERMES_API_KEY
      - "5000"
    volumes:
      - type: bind
        source: ./src
        target: /app
      - type: bind
        source: ./logs
        target: /logs
      # GPU 鎖檔和 search-mcp 共用：兩個容器的 /tmp 是分開的，鎖檔放各自的 /tmp 就各排各的隊
      - type: bind
        source: ./gpu_lock
        target: /gpu_lock
    env_file:
      - .env
    environment:
      # LlamaIndex 將在此服務中以 Python 套件方式執行（非獨立容器）
      - TZ=Asia/Taipei
      - LEMONADE_GPU_LOCK_PATH=/gpu_lock/lemonade_gpu.lock
    networks:
      - discord-net
      - hermes-net  # 呼叫 hermes:8642，並對 hermes 提供 /v1 模型端點
    depends_on:
      pgvector:
        condition: service_healthy

  # 情報搜尋的 MCP server（常駐）：給這台的 Claude Code 連（.mcp.json → http://127.0.0.1:8765/mcp），
  # 背景每 50 秒同步搜尋索引、每天 03:00 補算新文章的向量（llm/mcp_server.py、services/search/background.py）。
  # 沿用 bot 的映像與程式碼，但只帶用得到的環境變數：不帶 Discord token、Telegram 憑證
  search-mcp:
    build: *main-build
    container_name: search-mcp
    restart: always
    command: ["python", "-m", "llm.mcp_server", "--http"]
    expose:
      - "8765"  # 同一個 docker 網路的服務用 http://search-mcp:8765/mcp
    ports:
      - "127.0.0.1:8765:8765"  # 只綁本機：主機上的服務連得到，別台連不到
    volumes:
      - type: bind
        source: ./src
        target: /app
      - type: bind
        source: ./logs
        target: /logs
      # 搜尋索引（從 articles.db 建出來的衍生資料，刪掉會自動重建）
      - type: bind
        source: ./search_data
        target: /search_data
      - type: bind
        source: ./gpu_lock
        target: /gpu_lock
    environment:
      - TZ=Asia/Taipei
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LEMONADE_GPU_LOCK_PATH=/gpu_lock/lemonade_gpu.lock
      - LLM_BASE_URL=${LLM_BASE_URL:?LLM_BASE_URL_required}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - PGVECTOR_DB=${PGVECTOR_DB:-discord_data}
      - PGVECTOR_USER=${PGVECTOR_USER:?PGVECTOR_USER_required}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD_required}
    networks:
      - discord-net
      - hermes-net  # 對 hermes 提供 MCP 端點 http://search-mcp:8765/mcp
    depends_on:
      pgvector:
        condition: service_healthy

  # Hermes agent（官方映像）：bot 的附屬服務。不登入 Discord，只由 bot 呼叫，輸出由 bot 以自身身分發佈。
  #   API：OpenAI 相容 API server（:8642），驗證 Bearer HERMES_API_KEY
  #   推論：經 bot 的 /v1 端點（http://discord-bot:5000/v1），由 bot 驗證模型白名單、取得 GPU 鎖後轉發至 Lemonade
  #   情報：search-mcp 的 MCP 端點（http://search-mcp:8765/mcp）
  # 網路只接 hermes-net，理由見 networks.hermes-net。
  # profile "hermes"：預設的 `docker compose up -d` 不啟動此服務，以 `docker compose --profile hermes up -d hermes` 啟動；
  # 停用後不影響 bot 其他功能。
  # 狀態目錄 ./hermes_home 掛載為 /opt/data（設定、記憶、session、skill，不進版控）。首次啟動前須先建立目錄，
  # 並執行 `docker compose --profile hermes run --rm -it hermes setup` 產生 config.yaml。
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: hermes
    profiles: ["hermes"]
    restart: always
    command: ["gateway", "run"]
    expose:
      - "8642"  # OpenAI 相容 API，bot 以 http://hermes:8642/v1 呼叫
    volumes:
      - type: bind
        source: ./hermes_home
        target: /opt/data
    environment:
      - TZ=Asia/Taipei
      # 映像預設以 uid 10000 執行，並將 /opt/data 的擁有者改為該 uid。改用主機帳號的 uid/gid，./hermes_home 才能直接編輯、不需 sudo
      - HERMES_UID=1000
      - HERMES_GID=1000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      # 不使用 `:?` 必填語法：compose 對整份檔案做變數插值，未啟用的 profile 也在內，.env 缺值時所有服務都無法啟動。
      # 金鑰為空時 Hermes 拒絕啟用 API server，不會以無驗證狀態開放
      - API_SERVER_KEY=${HERMES_API_KEY:-}
    mem_limit: 2g
    networks:
      - hermes-net
    # 不宣告依賴 discord-bot：compose 啟動服務時會一併重建設定已變更的依賴，
    # 宣告後 `up -d hermes` 可能連帶重建 bot（重跑啟動 gate、中斷語音，也不會避開維護時段）。bot 不可用期間由 Hermes 重試
    depends_on:
      - search-mcp

  scraper:
    build:
      context: .
      dockerfile: docker/scraper/dockerfile
    container_name: scraper
    restart: always
    # FB 爬蟲每小時開關一次 Firefox（fb_scraper_service.py），Firefox 結束後它的子程序會改掛到容器的 PID 1。
    # 沒有 init 時 PID 1 是 python main.py，它不會清掉這些已結束的程序，會一直累積成殭屍（ps 裡的 <defunct>）。
    # init: true 讓 Docker 用一個小 init 程式當 PID 1，由它負責清掉。
    init: true
    expose:
      - "8000"  # 只在內網暴露 API 端口
    volumes:
      - type: bind
        source: ./src/scraper
        target: /app
      - type: bind
        source: ./logs
        target: /logs
    environment:
      - TZ=Asia/Taipei
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./articles.db}
      # 打 bot 通知伺服器時帶的共用密鑰，和 bot 同一個值（bot 從 env_file 拿）；沒設兩邊都不驗
      - NOTIFY_SHARED_SECRET=${NOTIFY_SHARED_SECRET:-}
    networks:
      - discord-net

  telegram-scraper:
    build:
      context: .
      dockerfile: docker/telegram_scraper/dockerfile
    container_name: telegram-scraper
    restart: always
    volumes:
      - type: bind
        source: ./src/telegram_scraper
        target: /app
      # 和 bot 共用的定義（頻道正規化、補圖時限）；只掛這一小包，不讓爬蟲看到 bot 其他程式
      - type: bind
        source: ./src/shared
        target: /opt/pylib/shared
        read_only: true
      - type: bind
        source: ./logs
        target: /logs
    environment:
      - TZ=Asia/Taipei
      - PYTHONPATH=/opt/pylib
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:?TELEGRAM_API_ID_required}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:?TELEGRAM_API_HASH_required}
      - TELEGRAM_PG_NOTIFY_CHANNEL=${TELEGRAM_PG_NOTIFY_CHANNEL:-telegram_new_message}
      - TELEGRAM_PGVECTOR_DB=${TELEGRAM_PGVECTOR_DB:-telegram_data}
      - PGVECTOR_DB=${PGVECTOR_DB:-discord_data}
      - PGVECTOR_USER=${PGVECTOR_USER:?PGVECTOR_USER_required}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD_required}
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - discord-net

  pgvector:
    image: pgvector/pgvector:pg18-trixie
    container_name: pgvector
    restart: always
    expose:
      - "5432"
    volumes:
      - vector_data:/var/lib/postgresql
    environment:
      - TZ=Asia/Taipei
      - POSTGRES_DB=${PGVECTOR_DB:-discord_data}
      - POSTGRES_USER=${PGVECTOR_USER:?PGVECTOR_USER_required}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD_required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:?PGVECTOR_USER_required} -d ${PGVECTOR_DB:-discord_data}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - discord-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    expose:
      - "8080"  # 內網給 discord-bot 呼叫
    ports:
      - "127.0.0.1:8888:8080"  # 僅本機 browser 測試用，不對外
    volumes:
      - type: bind
        source: ./searxng
        target: /etc/searxng
    environment:
      - TZ=Asia/Taipei
      # 官方 entrypoint 預設會 `chown -R searxng:searxng /etc/searxng`，把 bind mount 出來的
      # ./searxng 搶成 uid 977 → 主機端要 sudo 才改得動設定。關掉它，設定檔就能用一般身分編輯。
      # 安全：SearXNG 只「讀」settings.yml（entrypoint 的 setup() 只在檔案不存在時才從樣板產生），
      # 而且主程序是以 root 跑，讀 644 的檔案沒有問題。關掉只會在啟動 log 印一行 warning。
      # 注意：改這行要 `docker compose up -d searxng` 重建容器，`docker restart` 不會套用新 env。
      - FORCE_OWNERSHIP=false
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change_me_please_use_long_random_string}
      - UWSGI_WORKERS=${SEARXNG_WORKERS:-2}
      - UWSGI_THREADS=${SEARXNG_THREADS:-2}
    networks:
      - discord-net

networks:
  discord-net:
    driver: bridge
  # hermes 專用的隔離網路，成員為 hermes、discord-bot、search-mcp。
  # hermes 不可直連 Lemonade：Lemonade 沒有驗證，直連會繞過 bot 的 GPU 鎖與模型白名單。外網與宿主機一併阻斷。
  #   internal：不提供預設路由，阻斷對外連線
  #   gateway_mode_ipv4=isolated：bridge 不配置 IPv4 位址，阻斷容器存取宿主機上監聽 0.0.0.0 的服務
  #   （sshd、Cockpit、passimd）；須搭配 internal 使用
  hermes-net:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  vector_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/vector_data
